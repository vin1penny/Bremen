name: lyra-native-openpose-deterministic-tiling
input: /mnt/storage2/vincent/football-pose/videos/input/sample_30.mov
output_dir: /home/vincent/football-pose-results/native-resolution/openpose-tiled

video_output:
  enabled: true
  root: /mnt/storage2/vincent/football-pose/videos/output

# This differs from the OpenPose full-frame baseline only by deterministic tiling.
processors:
  - type: tile
    params:
      rows: 2
      columns: 2
      overlap_ratio: 0.10

cache:
  root: /home/vincent/football-pose-cache/artifacts
  format: auto
  shard_size: 256
  pin: true

models:
  - id: openpose-body25
    command:
      - bash
      - runners/container-runner.sh
      - vincent/football-pose-openpose:dev
      - --net-resolution=1920x1088
    checkpoint: /home/vincent/football-pose-private/checkpoints/pose_iter_584000.caffemodel
    batch_size: 1
    min_batch_size: 1
    devices: [7]
    timeout_seconds: 7200
