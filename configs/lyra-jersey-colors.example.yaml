# Palette intentionally empty: add RGB hex samples from the actual clip later.
# Copy this file alongside it as lyra-jersey-colors.yaml before customizing.
# The base config supplies the clip, three models and shared pitch settings.
base_config: lyra-preprocessing-base.yaml
output_root: /mnt/storage2/vincent/football-pose/results/football/jersey-colors
cache_root: /mnt/storage2/vincent/football-pose/cache/preprocessing

# Independent inspection export; does not add a preprocessing/model condition.
jersey_diagnostics:
  enabled: true
  frame_indices: [0, 1, 2, 3]

metadata:
  match_id: null
  jersey_colors:
    home: []
    away: []
    home_goalkeeper: []
    away_goalkeeper: []
    referee: []

methods:
  - name: baseline
  - name: jersey-mild
    processor:
      type: jersey_color_enhance
      params: &jersey_params
        # Omitting colors makes the processor read metadata.jersey_colors above.
        color_tolerance: 25.0
        strength: 0.25
        chroma_gain: 1.15
        clip_limit: 2.0
        tile_grid: [8, 8]
  - name: jersey-moderate
    processor:
      type: jersey_color_enhance
      params:
        <<: *jersey_params
        strength: 0.50
