name: lyra-native-preprocess-gamma-brighten
input: /mnt/storage2/vincent/football-pose/videos/input/sample_30.mov
output_dir: /home/vincent/football-pose-results/native-resolution/preprocessing/gamma-brighten

# Single-factor ablation: gamma above 1 lifts shadow detail.
processors:
  - type: gamma
    params:
      gamma: 1.2

cache:
  root: /home/vincent/football-pose-cache/artifacts
  format: ffv1
  shard_size: 256
  pin: true

models:
  - id: yolo-pose
    command:
      - bash
      - runners/container-runner.sh
      - vincent/football-pose-yolo:dev
      - --imgsz
      - native
      - --confidence
      - "0.25"
    checkpoint: /home/vincent/football-pose-private/checkpoints/yolov8x-pose.pt
    batch_size: 8
    min_batch_size: 1
    devices: [7]
    timeout_seconds: 3600

  - id: openpose-body25
    command:
      - bash
      - runners/container-runner.sh
      - vincent/football-pose-openpose:dev
      - --net-resolution=1920x1088
    checkpoint: /home/vincent/football-pose-private/checkpoints/pose_iter_584000.caffemodel
    batch_size: 1
    min_batch_size: 1
    devices: [7]
    timeout_seconds: 7200

fail_fast: false
