name: lyra-yolo-full-frame-baseline
input: /home/vincent/projects/Bremen/footage/sample_30.mov
output_dir: /home/vincent/football-pose-results/yolo-full-frame

# No image preprocessing: this is the reference input for the tiling comparison.
processors: []

cache:
  root: /home/vincent/football-pose-cache/artifacts
  format: ffv1
  shard_size: 256
  pin: true

models:
  - id: yolo-pose
    command:
      - bash
      - runners/container-runner.sh
      - vincent/football-pose-yolo:dev
      - --imgsz
      - "640"
      - --confidence
      - "0.25"
    checkpoint: /home/vincent/football-pose-private/checkpoints/yolov8x-pose.pt
    batch_size: 8
    min_batch_size: 1
    devices: [0]
    timeout_seconds: 3600
