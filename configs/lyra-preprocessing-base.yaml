name: lyra-single-step
input: /mnt/storage2/vincent/football-pose/videos/input/sample_30.mov
output_dir: /mnt/storage2/vincent/football-pose/results/football/single-step

video_output:
  enabled: true
  root: /mnt/storage2/vincent/football-pose/videos/output

pitch_filter:
  enabled: true
  checkpoint: /mnt/storage2/vincent/football-pose/models/pitch-reference/roboflow-football-pitch.pt
  checkpoint_sha256: 28f68f7c4056d6d9b137efd2e7ab5f3c494039380c63831649126ced25628b36
  cache_root: /mnt/storage2/vincent/football-pose/cache/pitch
  device: "0"
  image_size: 640
  batch_size: 1
  detection_confidence: 0.25
  landmark_confidence: 0.5
  minimum_landmarks: 4
  ransac_threshold_cm: 150.0
  minimum_inlier_ratio: 0.6
  maximum_median_reprojection_cm: 200.0
  max_fallback_frames: 0
  pitch_margin_cm: 50.0
  pitch_bbox_margin_px: 10.0
  ankle_confidence: 0.2
  deduplication_iou: 0.5

# Screening replaces this empty list with exactly one method at a time.
processors: []

cache:
  root: /mnt/storage2/vincent/football-pose/cache/preprocessing
  format: ffv1
  shard_size: 256
  pin: true

# Model settings match the full-frame baselines; models run serially on GPU 0.
models:
  - id: yolo26-pose
    command:
      - bash
      - runners/container-runner.sh
      - vincent/football-pose-yolo26:dev
      - --imgsz
      - "1920"
      - --confidence
      - "0.25"
      - --nms-free
    checkpoint: /home/vincent/football-pose-private/checkpoints/yolo26x-pose.pt
    batch_size: 8
    min_batch_size: 1
    devices: [0]
    timeout_seconds: 3600

  - id: openpose-body25
    command:
      - bash
      - runners/container-runner.sh
      - vincent/football-pose-openpose:dev
      - --net-resolution=1920x1088
    checkpoint: /home/vincent/football-pose-private/checkpoints/pose_iter_584000.caffemodel
    batch_size: 1
    min_batch_size: 1
    devices: [0]
    timeout_seconds: 7200

  # Top-down input adapter: these detection weights supply HRNet's person boxes.
  # Shared crop artifacts bypass this detector instead of detecting twice.
  - id: hrnet-w32
    command:
      - bash
      - runners/container-runner.sh
      - vincent/football-pose-hrnet:dev
      - --pose-config
      - td-hm_hrnet-w32_8xb64-210e_coco-256x192
      - --det-model
      - whole_image
      - --detector-image-size
      - "1920"
      - --detector-confidence
      - "0.3"
      - --detector-class-ids
      - "1,2,3"
      - --crop-padding
      - "0.1"
      - --crop-min-size
      - "32"
    checkpoint: /mnt/storage2/vincent/football-pose/models/hrnet-w32-coco-256x192.pth
    auxiliary_checkpoints:
      detector: /mnt/storage2/vincent/football-pose/models/player-detection-best.pt
    batch_size: 8
    min_batch_size: 1
    devices: [0]
    timeout_seconds: 14400

fail_fast: false
