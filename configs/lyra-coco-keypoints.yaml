    command: [bash, runners/container-runner.sh, 'vincent/football-pose-yolo26:dev', --imgsz, '640', --confidence, '0.001', --iou, '0.7', --nms-free]
    checkpoint: /home/vincent/football-pose-private/checkpoints/yolo26x-pose.pt
    batch_size: 8
    min_batch_size: 1
    devices: [0]
    timeout_seconds: 14400
