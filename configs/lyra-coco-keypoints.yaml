# Dedicated benchmark: no football preprocessing, tracking or pitch filtering.
annotations: /mnt/storage2/vincent/football-pose/datasets/coco/annotations/person_keypoints_val2017.json
images: /mnt/storage2/vincent/football-pose/datasets/coco/val2017
output_dir: /mnt/storage2/vincent/football-pose/results/coco-keypoints
cache_root: /mnt/storage2/vincent/football-pose/cache/coco
models:
