name: lyra-native-preprocess-clahe
input: /mnt/storage2/vincent/football-pose/videos/input/sample_30.mov
output_dir: /home/vincent/football-pose-results/native-resolution/preprocessing/clahe

# Single-factor ablation: local luminance contrast normalization.
processors:
  - type: clahe
    params:
      clip_limit: 2.0
      tile_grid: [8, 8]

cache:
  root: /home/vincent/football-pose-cache/artifacts
  format: ffv1
  shard_size: 256
  pin: true

# Model settings match the full-frame baselines; models run serially on GPU 7.
models:
  - id: yolo-pose
    command:
      - bash
      - runners/container-runner.sh
      - vincent/football-pose-yolo:dev
      - --imgsz
      - native
      - --confidence
      - "0.25"
    checkpoint: /home/vincent/football-pose-private/checkpoints/yolov8x-pose.pt
    batch_size: 8
    min_batch_size: 1
    devices: [7]
    timeout_seconds: 3600

  - id: openpose-body25
    command:
      - bash
      - runners/container-runner.sh
      - vincent/football-pose-openpose:dev
      - --net-resolution=1920x1088
    checkpoint: /home/vincent/football-pose-private/checkpoints/pose_iter_584000.caffemodel
    batch_size: 1
    min_batch_size: 1
    devices: [7]
    timeout_seconds: 7200

fail_fast: false
