name: lyra-native-yolo-deterministic-tiling
input: /mnt/storage2/vincent/football-pose/videos/input/sample_30.mov
output_dir: /home/vincent/football-pose-results/native-resolution/yolo-tiled

video_output:
  enabled: true
  root: /mnt/storage2/vincent/football-pose/videos/output

# This differs from the full-frame baseline only by deterministic tiling.
processors:
  - type: tile
    params:
      rows: 2
      columns: 2
      overlap_ratio: 0.10

cache:
  root: /home/vincent/football-pose-cache/artifacts
  format: auto
  shard_size: 256
  pin: true

models:
  - id: yolo-pose
    command:
      - bash
      - runners/container-runner.sh
      - vincent/football-pose-yolo:dev
      - --imgsz
      - "1920"
      - --confidence
      - "0.25"
    checkpoint: /home/vincent/football-pose-private/checkpoints/yolov8x-pose.pt
    batch_size: 8
    min_batch_size: 1
    devices: [7]
    timeout_seconds: 3600
