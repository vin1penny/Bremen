name: lyra-native-yolo-deterministic-tiling
input: /mnt/storage2/vincent/football-pose/videos/input/sample_30.mov
output_dir: /home/vincent/football-pose-results/native-resolution/yolo-tiled

video_output:
  enabled: true
  root: /mnt/storage2/vincent/football-pose/videos/output

pitch_filter:
  enabled: true
  checkpoint: /home/vincent/football-pose-private/checkpoints/pitch-detection-best.pt
  cache_root: /home/vincent/football-pose-cache/pitch
  device: "0"
  image_size: 640
  batch_size: 16
  detection_confidence: 0.25
  landmark_confidence: 0.5
  minimum_landmarks: 4
  ransac_threshold_cm: 150.0
  minimum_inlier_ratio: 0.6
  maximum_median_reprojection_cm: 200.0
  max_fallback_frames: 5
  pitch_margin_cm: 50.0
  pitch_bbox_margin_px: 10.0
  ankle_confidence: 0.2
  deduplication_iou: 0.5

# This differs from the full-frame baseline only by deterministic tiling.
processors:
  - type: tile
    params:
      rows: 2
      columns: 2
      overlap_ratio: 0.10

cache:
  root: /home/vincent/football-pose-cache/artifacts
  format: auto
  shard_size: 256
  pin: true

models:
  - id: yolo-pose
    command:
      - bash
      - runners/container-runner.sh
      - vincent/football-pose-yolo:dev
      - --imgsz
      - "1920"
      - --confidence
      - "0.25"
    checkpoint: /home/vincent/football-pose-private/checkpoints/yolov8x-pose.pt
    batch_size: 8
    min_batch_size: 1
    devices: [7]
    timeout_seconds: 3600
